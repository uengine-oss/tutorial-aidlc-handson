spring.application.name=u2-reservation-service
server.port=${SERVER_PORT:8082}
# 내부 경로(/internal/**)를 막는 방어선: 기본은 루프백에만 연다 (NFR6.5).
server.address=${SERVER_ADDRESS:127.0.0.1}

# 상태 확인 경로(health)만 노출한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# u1 검색 서비스 주소 (C4)
search.service.url=${SEARCH_SERVICE_URL:http://127.0.0.1:8081}

# 결제 요청 시점부터 자동 취소까지의 시간
reservation.payment-timeout=180s

# 푸시 설정: 동시 구독 수 상한, 연결별 쓰기 큐 상한, 쓰기 하나의 상한, 연결 유지 신호 간격
reservation.push.max-subscriptions=32
reservation.push.queue-limit=16
reservation.push.write-timeout=1s
reservation.push.keep-alive-interval=15s
reservation.push.emitter-timeout=10m
