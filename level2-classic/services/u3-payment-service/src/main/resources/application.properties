spring.application.name=u3-payment-service
server.port=${SERVER_PORT:8083}
# 웹훅 경로의 방어선은 서명 검증이고, 기본은 루프백에만 연다 (NFR6.7).
server.address=${SERVER_ADDRESS:127.0.0.1}

# 상태 확인 경로(health)만 노출한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 2.5 같은 실수를 정수로 깎아 받지 않는다 (경계 입력 검증).
spring.jackson.deserialization.accept-float-as-int=false

# u2 예약 서비스 주소 (C5)
reservation.service.url=${RESERVATION_SERVICE_URL:http://127.0.0.1:8082}

# 모의 PG가 부르는 이 서비스의 웹훅 주소 (C6)
payment.webhook.url=${WEBHOOK_URL:http://127.0.0.1:8083/api/payments/webhook}

# 웹훅 서명 공유 값: 환경 변수로만 주입하고 기본값을 두지 않는다. 없거나 비어 있으면 기동하지 않는다 (BR3.2).
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}
